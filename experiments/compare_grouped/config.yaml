# Grouped GEMM 통합 설정 (CUDA 기준)
# CUDA, Triton, Torch 백엔드가 동일한 config로 벤치마크

# uniform mode: batch_size개 GEMM, same M,N,K
# (CUDA grouped_gemm.cu 기본값과 동일)
# grouped:
#   batch_size: 8
#   m: 1024
#   n: 4096
#   k: 14336

# grouped:
#   batch_size: 8
#   m: 2048
#   n: 2048
#   k: 2048

# grouped:
#   m: [1024, 512, 256, 128]
#   n: [1024, 512, 256, 128]
#   k: [1024, 512, 256, 128]


# grouped:
#   m: [8192, 4096, 2048, 2048]
#   n: [8192, 4096, 2048, 2048]
#   k: [2048, 2048, 2048, 2048]


# 특정 전문가(Expert 0, 1)에 부하가 집중된 경우
grouped:
  m: [8192, 4096, 512, 128, 64, 32, 16, 8]
  n: [14336, 14336, 14336, 14336, 14336, 14336, 14336, 14336]
  k: [4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096]

# 전문가별 토큰 분배가 비교적 고른 편이지만 사이즈는 모두 다른 경우
# grouped:
#   m: [1024, 896, 768, 512, 384, 256, 128, 64]
#   n: [14336, 14336, 14336, 14336, 14336, 14336, 14336, 14336]
#   k: [4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096]

# 많은 수의 전문가(16그룹)에게 파편화된 워크로드
# grouped:
#   m: [2048, 1024, 512, 512, 256, 256, 128, 128, 64, 64, 32, 32, 16, 16, 8, 8]
#   n: [11008, 11008, 11008, 11008, 11008, 11008, 11008, 11008, 11008, 11008, 11008, 11008, 11008, 11008, 11008, 11008]
#   k: [4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096]

benchmark:
  repeat: 1000
  warmup: 50
