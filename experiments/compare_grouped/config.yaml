# Grouped GEMM 통합 설정 (CUDA 기준)
# CUDA, Triton, Torch 백엔드가 동일한 config로 벤치마크

# uniform 모드: batch_size개 GEMM, 모두 동일한 M,N,K
# (CUDA grouped_gemm.cu 기본값과 동일)
grouped:
  batch_size: 8
  m: 1024
  n: 4096
  k: 14336

# 리스트 모드로 바꾸려면 아래처럼 사용:
# grouped:
#   m: [1024, 512, 256, 128]
#   n: [1024, 512, 256, 128]
#   k: [1024, 512, 256, 128]

benchmark:
  repeat: 1000
  warmup: 50
