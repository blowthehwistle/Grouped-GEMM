# Grouped GEMM 비교 실험용 설정
# CUDA, Cutlass, PyTorch, Triton 백엔드 간 성능 비교

benchmark:
  # 벤치마크할 행렬 크기 (M, N, K)
  sizes:
    - [1024, 1024, 1024]
    - [2048, 2048, 2048]
    - [4096, 4096, 4096]
  # 그룹 크기 (서로 다른 M,N,K를 가진 GEMM 개수)
  group_size: 8
  # 반복 횟수
  repeat: 100

output:
  # 결과 저장 경로
  benchmark_dir: ../../results/benchmark
  # 비교 차트 저장 경로
  plot_dir: ../../results/tuned
